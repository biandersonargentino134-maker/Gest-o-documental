<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardar Arquivos — Gestão documental</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🗂️</div>
    <h1>Guardar Arquivos</h1>
    <p class="sub">Gestão documental</p>
    <form id="login-form">
      <div class="field">
        <label for="login-email">E-mail</label>
        <input type="email" id="login-email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="login-password">Senha</label>
        <input type="password" id="login-password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary block">Entrar</button>
      <div id="login-error"></div>
    </form>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="main-app" hidden>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-icon">🗂️</span>
      <div>
        <div class="brand-name">Guardar Arquivos</div>
        <div class="brand-sub">Gestão documental</div>
      </div>
    </div>
    <nav>
      <a href="#" class="nav-item active" data-view="inicio"><span class="icon">🏠</span> Início</a>
      <a href="#" class="nav-item" data-view="documentos"><span class="icon">🗂️</span> Documentos</a>
    </nav>
    <div class="sidebar-spacer"></div>
    <div class="user-email" id="user-email"></div>
    <button class="sidebar-logout" id="logout-btn">↩ Sair</button>
  </aside>

  <main class="content">
    <section class="view active" id="view-inicio">
      <div class="page-header">
        <div>
          <h1>Início</h1>
          <p>Resumo dos seus documentos.</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-space-used">0 MB</div>
        <div class="stat-lbl">de espaço usado</div>
      </div>
    </section>

    <section class="view" id="view-documentos">
      <div class="page-header">
        <div>
          <h1>Documentos</h1>
          <p>Envie e organize seus documentos fiscais.</p>
        </div>
      </div>

      <form id="upload-form" class="details-card">
        <div class="field">
          <label for="upload-file">Arquivo</label>
          <input type="file" id="upload-file" required>
        </div>
        <div class="field">
          <label for="upload-empresa">Empresa</label>
          <input type="text" id="upload-empresa" required>
        </div>
        <div class="field">
          <label for="upload-tipo">Tipo de imposto</label>
          <input type="text" id="upload-tipo" required>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="upload-mes">Mês</label>
            <select id="upload-mes" required></select>
          </div>
          <div class="field">
            <label for="upload-ano">Ano</label>
            <input type="number" id="upload-ano" required>
          </div>
        </div>
        <button type="submit" class="btn-primary">Enviar documento</button>
      </form>

      <ul id="doc-list" class="doc-list"></ul>
    </section>
  </main>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
