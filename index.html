<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardar Arquivos - Cofre Fiscal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!--LOGIN-->
    <!-- Por enquanto só visual-->
     <div id="login-screen">
        <div class="login-card">
            <div class="dial">
                <svg viewBox="0 0 100 100">
                    <circle class="dial-ring" cx="50" cy="50" r="42"></circle>
                    <g class="dial-ticks">
                        <line x1="50" y1="8" x2="50" y2="16"></line>
                        <line x1="50" y1="84" x2="50" y2="92"></line>
                        <line x1="8" y1="50" x2="16" y2="50"></line>
                        <line x1="84" y1="50" x2="92" y2="50"></line>
                    </g>
                    <circle cx="50" cy="50" r="6" fill="#c9a227"></circle>
                </svg>
                <div class="dial-center">🔐​​</div>
        </div>
        <h1>Guardar Arquivos</h1>
        <p class="sub">Cofre digital de documentos fiscais</p>
        <form id="login-form">
            <div class="field">
                <label for="login-email">E-mail</label>
                <input type="email" id="login-email" required>
            </div>
            <div class="field">
                <label for="login-password">Senha</label>
                <input type="password" id="login-password" required>
            </div>
            <button type="submit" class="btn">Entrar</button>
            <div id="login-error"></div>
        </form>
     </div>
     </div>

     <!-- App (esqueleto, ainda sem dados de verdade) -->
      <div id="main-app" hidden>
        <aside class="sidebar">
            <div class="brand"><span class="brand-mark">🔐</span> Guardar Arquivos</div>
            <nav>
                <a href="#" class="nav-item active" data-view="Inicio">🏠​ Início</a>
                <a href="#" class="nav-item" data-view="documentos">📁​ Documentos</a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-email" id="user-email"></div>
                <button class="btn btn-ghost btn-sm" id="logout-btn">Sair</button>
            </div>
        </aside>

        <main class="content">
            <section class="view active" id="view-inicio">
                <h2>Inicio</h2>
                <p>Aqui vai entrar o resumo dos documentos (ainda não conectado a nenhum banco de dados).</p>
            </section>

            <section class="view" id="view-documentos">
                <h2>Documentos</h2>
                <p>Aqui vai entrar a lista de documentos e o formulario de upload.</p>
            </section>
        </main>
      </div>

      <script src="script.js"></script>
</body>
</html>
